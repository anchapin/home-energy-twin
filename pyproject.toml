[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-energy-twin"
version = "0.1.0"
description = "Core domain types, service protocols and UTC/interval plumbing for home-energy-twin"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10"]

[tool.setuptools]
packages = ["home_energy_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
files = ["home_energy_twin"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
